# 本地统一的 PostgreSQL 16 + pgvector 环境
# 启动：docker compose up -d db
# 停止：docker compose down
# 注意：首次启动才会执行 db/init 下的初始化 SQL；已有 volume 不会重复执行。
name: academia-industry-match

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aim-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-academia_industry_match}
      POSTGRES_USER: ${POSTGRES_USER:-aim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-dev}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aim_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  aim_pgdata:
