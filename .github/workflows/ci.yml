name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python scripts
        run: python -m compileall -q scripts
      - name: Check for committed .env or large obvious secrets
        run: |
          set -e
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "ERROR: .env must not be committed" >&2
            exit 1
          fi
          echo "No .env committed."
